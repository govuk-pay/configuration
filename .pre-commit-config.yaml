repos:
  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform format
        entry: scripts/pre-commit-tf-fmt.sh
        language: script
        files: \.tf$
        pass_filenames: false
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
